<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>nui-sftp release</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="top">
            <div class="title">
                <h1>nui-sftp <span id="version">…</span></h1>
                <div class="subtitle"><span id="connection" class="connection" title="live updates"></span><span id="deploy-root"></span></div>
            </div>
            <div class="counts" id="counts"></div>
            <div class="controls">
                <label class="field-label" title="CMAKE_BUILD_PARALLEL_LEVEL for makepkg and the flatpak build"
                    >jobs <input id="setting-jobs" class="script-nui-text-input" type="number" min="1" max="64"
                /></label>
                <button id="setting-headless" class="script-nui-checkbox" type="button" title="Local test runs without a window (Chromium headless ozone)">
                    <span class="script-nui-checkbox-box"><svg viewBox="0 0 24 24"><path d="m5 13 4 4 10-10"></path></svg></span>
                    <span class="script-nui-checkbox-label">headless</span>
                </button>
                <button id="setting-mac" class="script-nui-checkbox" type="button" title="Do not put the Mac to sleep afterwards">
                    <span class="script-nui-checkbox-box"><svg viewBox="0 0 24 24"><path d="m5 13 4 4 10-10"></path></svg></span>
                    <span class="script-nui-checkbox-label">keep Mac awake</span>
                </button>
                <span class="alarm-control">
                    <button id="setting-alarm" class="script-nui-checkbox" type="button" title="Chime when the run reaches the push step and when the PR is merged">
                        <span class="script-nui-checkbox-box"><svg viewBox="0 0 24 24"><path d="m5 13 4 4 10-10"></path></svg></span>
                        <span class="script-nui-checkbox-label">alarm</span>
                    </button>
                    <input id="setting-volume" class="script-nui-slider" type="range" min="0" max="100" step="5" title="Alarm volume (plays a preview)" />
                    <span id="volume-label" class="volume-label"></span>
                    <span id="sound-hint" class="script-nui-pill" data-selected="false" hidden title="Browsers only play sound after you interacted with the page"
                        ><span class="script-nui-pill-label">click to enable sound</span></span
                    >
                </span>
                <button id="run-all" class="script-nui-button" data-variant="primary" type="button">Run all</button>
                <button id="pause" class="script-nui-button" data-variant="warning" type="button" title="Start no further steps, let running ones finish">Pause</button>
                <button id="stop-all" class="script-nui-button" data-variant="danger" type="button" title="Stop every running step">Stop</button>
                <button id="reset-all" class="script-nui-button" type="button" title="Put every step back to pending, except what already left this machine">Reset all</button>
            </div>
        </header>
        <main id="phases"></main>
        <template id="step-template">
            <details class="script-nui-collapsible step">
                <summary class="script-nui-collapsible-summary step-head">
                    <svg class="script-nui-collapsible-chevron" viewBox="0 0 16 16">
                        <path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="status-icon"></span>
                    <span class="script-nui-collapsible-title step-title"></span>
                    <span class="badges script-nui-pill-list"></span>
                    <span class="summary"></span>
                    <span class="duration"></span>
                    <span class="script-nui-collapsible-header-end actions"></span>
                </summary>
                <div class="script-nui-collapsible-body step-body"></div>
            </details>
        </template>
        <script src="app.js" type="module"></script>
    </body>
</html>
