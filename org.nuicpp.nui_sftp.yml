id: org.nuicpp.nui_sftp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# zypak, which Chromium's sandbox needs inside Flatpak.
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.node24
command: nui-sftp

finish-args:
  - --share=network
  - --share=ipc
  - --filesystem=host
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 --with-program_options --with-filesystem --with-system --with-serialization --with-thread --with-mpi --with-iostreams --with-asio --with-process install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz
        sha256: 5e93d582aff26868d581a52ae78c7d8edf3f3064742c6e77901a1f18a437eea9

  - name: libssh
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://www.libssh.org/files/0.12/libssh-0.12.2.tar.xz
        sha256: 49560f677d96e3706a904ac2de1116e25f3680937d51e5c92198fcba4a1c1e9f

  - name: interval-tree
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include
      - cp -r include/interval-tree /app/include/interval-tree
    sources:
      - type: git
        url: https://github.com/5cript/interval-tree.git
        tag: v3.1.4
        commit: f932f5885286d3c0f4d7c9a01f0aeff2da1105c5

  - name: nlohmann-json
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.12.0
        commit: 55f93686c01528224f448c19128836e7df245f72

  - name: nui-sftp-frontend
    buildsystem: simple
    build-commands:
      - mkdir -p /app/frontend
      - cp -r * /app/frontend
    sources:
      - type: archive
        url: https://github.com/5cript/nui-sftp/releases/download/v1.7.2/nui-sftp-linux-frontend_1.7.2.tar.gz
        sha256: 15944efa0bf45022af1167dc425877d30edcadac8b68154aed0dcfbd7c1e6495

  - name: nui-sftp
    buildsystem: cmake-ninja
    builddir: true
    no-make-install: true
    build-options:
      env:
        CC: clang
        CXX: clang++
        LD: lld
        INSTALL_TARGET: /app
        Boost_ROOT: /app
      append-path: "/usr/lib/sdk/llvm22/bin:/usr/lib/sdk/node24/bin"
      prepend-ld-library-path: "/usr/lib/sdk/llvm22/lib"
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_C_COMPILER=clang
      - -DCMAKE_CXX_COMPILER=clang++
      - -DCMAKE_LINKER=lld
      - -DCMAKE_CXX_EXTENSIONS=ON
      - -DCMAKE_CXX_STANDARD=23
      - -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - -DOFFLINE_BUILD=ON
      - -DJSON_Diagnostics=ON
      - -DNUI_BROWSER_ENGINE=cef
      - -DNUI_CEF_ARCHIVE=/run/build/nui-sftp/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_linux64_minimal.tar.bz2
      - -DNUI_SFTP_FLATPAK=ON
      - -DFORCED_PROJECT_VERSION=1.7.2
    post-install:
      - OMIT_FRONTEND=true BUILD_DIRECTORY="$(pwd)" ../scripts/deploy.sh
      # Rename the desktop Icon= entry to the reverse-DNS app id used by Flatpak.
      # Upstream ships "Icon=nui_sftp" because the icon filename differs across
      # packaging formats.
      - desktop-file-edit --set-icon=org.nuicpp.nui_sftp ../org.nuicpp.nui_sftp.desktop
      # Install AppStream metadata
      - install -Dm644 ../deploy-meta/org.nuicpp.nui_sftp.metainfo.xml /app/share/metainfo/org.nuicpp.nui_sftp.metainfo.xml
      # Install desktop file
      - install -Dm644 ../org.nuicpp.nui_sftp.desktop /app/share/applications/org.nuicpp.nui_sftp.desktop
      # Image
      - install -Dm644 ../NUI-SFTP_Logo-01_nopad.svg /app/share/icons/hicolor/scalable/apps/org.nuicpp.nui_sftp.svg
      # Licenses of CEF and the Chromium components in it
      - install -Dm644 _deps/cef/cef_binary_*/LICENSE.txt /app/share/licenses/org.nuicpp.nui_sftp/CEF-LICENSE.txt
      - install -Dm644 _deps/cef/cef_binary_*/CREDITS.html /app/share/licenses/org.nuicpp.nui_sftp/CEF-CREDITS.html
    sources:
      - type: git
        url: https://github.com/5cript/nui-sftp
        tag: v1.7.2
        commit: baff63902175d3afa7f353bf40c6cf01b36c59e6
      - type: git
        url: https://github.com/5cript/nui-sftp-deploy
        tag: flatpak/1.1.0_1
        commit: 8ff88536f0342261ee3bbab55d147ad4cfff80bd
        disable-submodules: true
        dest: deploy-meta
      - type: file
        url: https://s3.g.s4.mega.io/jgemkib4a5fte35rktt5wxrwkw4ejk4ybemkf/nui-scp/images/NUI-SFTP_Logo-01_nopad.svg
        sha256: cf0fc442069dfd28bd8b7769da6dfdca92111044ea9817197716ed9bfada3869
      # The CEF distribution Nui pins (cmake/dependencies/cef_version.cmake in Nui), extracted by NUI_CEF_ARCHIVE.
      - type: file
        url: https://cef-builds.spotifycdn.com/cef_binary_154.0.34%2Bg14c5a08%2Bchromium-154.0.8037.98_linux64_minimal.tar.bz2
        dest-filename: cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_linux64_minimal.tar.bz2
        sha256: e87e2c76304372dd28b899ceb6efa4b353f52700594ddc358a8237ec07ec6492
